version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres-docker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: inventory_db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data

  node-app:
    build: .
    container_name: node-docker-app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    command: nodemon server.js
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:root@db:5432/inventory_db
    depends_on:
      - db


volumes:
  db_data: